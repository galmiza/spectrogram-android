name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6 # also validates the Gradle wrapper
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checks-reports
          path: app/build/reports

  screenshots:
    name: Screenshot tests
    # The reference images are recorded on a Mac; rendering elsewhere may differ slightly
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugScreenshotTestDefaultTestSuite
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-reports
          path: app/build/reports

  device:
    name: Device smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew phoneDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-reports
          path: app/build/reports
